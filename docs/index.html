<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>喝水桌宠 - 陪伴你健康饮水</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="喝水桌宠">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #F4F8FB; color: #2C3E50; display: flex; justify-content: center; min-height: 100vh; padding: 14px; }
    .app-container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
    
    /* 顶部卡片 */
    .pet-card {
      background: white; border-radius: 20px; padding: 18px; box-shadow: 0 4px 16px rgba(2, 136, 209, 0.08);
      display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden;
    }
    .pet-wrapper { position: relative; width: 100px; height: 100px; cursor: pointer; user-select: none; }
    .pet-svg { width: 100%; height: 100%; filter: drop-shadow(0 6px 10px rgba(41, 182, 246, 0.3)); animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .bounce { animation: bounce 0.4s ease-in-out !important; }
    @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15) translateY(-8px); } }
    
    /* 对话气泡 */
    .bubble {
      background: #FAFCFF; border: 1.5px solid #D0E7F9; border-radius: 16px; padding: 12px 14px; margin-top: 10px;
      box-shadow: 0 4px 12px rgba(2, 136, 209, 0.06); width: 100%; text-align: center;
    }
    .bubble-title { font-weight: bold; color: #0277BD; font-size: 14px; margin-bottom: 4px; }
    .bubble-text { font-size: 12px; color: #546E7A; line-height: 1.4; margin-bottom: 10px; }
    .bubble-actions { display: flex; justify-content: center; gap: 10px; }
    .btn { border: none; border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #0288D1; color: white; }
    .btn-primary:active { transform: scale(0.96); background: #01579B; }
    .btn-outline { background: #FFF3E0; color: #E65100; }

    /* 倒计时 */
    .timer-badge { margin-top: 8px; font-size: 11px; color: #90A4AE; background: #ECEFF1; padding: 3px 10px; border-radius: 10px; }

    /* 🎯 目标设置卡片 */
    .goal-card {
      background: white; border-radius: 20px; padding: 16px; box-shadow: 0 4px 16px rgba(2, 136, 209, 0.08);
      display: flex; flex-direction: column; gap: 10px;
    }
    .card-title { font-size: 15px; font-weight: bold; color: #263238; }
    .goal-inputs { display: flex; gap: 10px; }
    .goal-box {
      flex: 1; background: #FAFCFF; border: 1.5px solid #D0E7F9; border-radius: 14px; padding: 10px; cursor: pointer;
    }
    .goal-label { font-size: 11px; color: #78909C; }
    .goal-val { font-size: 16px; font-weight: bold; color: #01579B; margin-top: 2px; }
    .goal-calc { font-size: 12px; font-weight: bold; color: #0288D1; margin-top: 2px; }
    .progress-bar-bg { width: 100%; height: 8px; background: #ECEFF1; border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .progress-bar-fill { height: 100%; width: 0%; background: #0288D1; border-radius: 4px; transition: width 0.3s; }
    .progress-text { font-size: 11px; color: #78909C; margin-top: 2px; }

    /* 📊 日历卡片 */
    .calendar-card {
      background: white; border-radius: 20px; padding: 16px; box-shadow: 0 4px 16px rgba(2, 136, 209, 0.08);
      display: flex; flex-direction: column; gap: 10px;
    }
    .cal-header { display: flex; justify-content: space-between; align-items: center; }
    .cal-title { font-size: 15px; font-weight: bold; color: #263238; }
    .cal-nav { background: none; border: none; font-size: 14px; color: #0288D1; cursor: pointer; padding: 4px 8px; font-weight: bold; }

    /* 月度指标总览 */
    .stats-overview {
      display: flex; background: #F0F8FF; border-radius: 12px; padding: 10px 0; text-align: center;
    }
    .stat-item { flex: 1; border-right: 1px solid #DCEBF8; }
    .stat-item:last-child { border-right: none; }
    .stat-num { font-size: 15px; font-weight: bold; color: #01579B; }
    .stat-label { font-size: 11px; color: #78909C; margin-top: 2px; }

    /* 日历网格 */
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; font-weight: bold; color: #90A4AE; margin-bottom: 2px; }
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day-cell {
      aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 12px; cursor: pointer; transition: 0.15s; position: relative; border: 1.5px solid transparent;
    }
    .day-cell:hover { background: #E1F5FE; }
    .day-cell.today { border-color: #0288D1; color: #0288D1; font-weight: bold; }
    .day-cell.selected { background: #0288D1 !important; color: white !important; font-weight: bold; }
    .day-cell.selected .day-cups { color: white !important; }
    .day-cell.goal { background: #E8F5E9; border-color: #A5D6A7; }
    .day-cups { font-size: 9px; color: #0288D1; margin-top: 1px; }

    /* 单日详情栏 */
    .day-detail {
      background: #F9FBFE; border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;
    }
    .detail-left { display: flex; flex-direction: column; gap: 2px; }
    .detail-date { font-size: 13px; font-weight: bold; color: #37474F; }
    .detail-cups { font-size: 12px; color: #0288D1; }
    .detail-actions { display: flex; gap: 6px; }
    .btn-round { width: 32px; height: 32px; border-radius: 16px; border: 1px solid #CFD8DC; background: white; font-weight: bold; cursor: pointer; }
    .btn-add { background: #0288D1; color: white; border: none; }
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- 桌面水滴卡片 -->
  <div class="pet-card">
    <div class="pet-wrapper" id="petWrapper" onclick="onPetClick()">
      <!-- 可爱水滴 SVG -->
      <svg class="pet-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 4 C32 4 12 28 12 42 C12 53.05 20.95 62 32 62 C43.05 62 52 53.05 52 42 C52 28 32 4 32 4 Z" fill="#29B6F6"/>
        <path d="M23 26 C23 26 18 34 18 40 C18 43 20 45 22 45 C20 43 19.5 39 23 34 C25 31 25.5 28 23 26 Z" fill="#81D4FA"/>
        <ellipse cx="24" cy="43.5" rx="3" ry="3.5" fill="#0D47A1"/>
        <ellipse cx="23" cy="42.2" rx="1" ry="1.2" fill="white"/>
        <ellipse cx="40" cy="43.5" rx="3" ry="3.5" fill="#0D47A1"/>
        <ellipse cx="39" cy="42.2" rx="1" ry="1.2" fill="white"/>
        <ellipse cx="18" cy="48" rx="3" ry="2" fill="#FF8A80"/>
        <ellipse cx="46" cy="48" rx="3" ry="2" fill="#FF8A80"/>
        <path d="M28.5 46.5 Q32 50.5 35.5 46.5" stroke="#0D47A1" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- 喝水对话气泡 -->
    <div class="bubble" id="bubbleBox">
      <div class="bubble-title">💧 喝水时间到了！</div>
      <div class="bubble-text">已经过了半小时，起来喝杯温水，润润嗓子活动一下吧~</div>
      <div class="bubble-actions">
        <button class="btn btn-outline" onclick="delayReminder()">稍后 (5m)</button>
        <button class="btn btn-primary" onclick="drinkWater()">喝了一杯 🥛</button>
      </div>
    </div>

    <div class="timer-badge" id="timerBadge">下次提醒：29分50秒</div>
  </div>

  <!-- 🎯 每日目标与水杯设置 -->
  <div class="goal-card">
    <div class="card-title">🎯 每日目标与水杯设置</div>
    <div class="goal-inputs">
      <div class="goal-box" onclick="promptDailyTarget()">
        <div class="goal-label">每日喝水目标 ✎</div>
        <div class="goal-val" id="valDailyTarget">2000 ml</div>
      </div>
      <div class="goal-box" onclick="promptCupCapacity()">
        <div class="goal-label">单杯水容量 ✎</div>
        <div class="goal-val" id="valCupCapacity">250 ml</div>
      </div>
    </div>
    <div class="goal-calc" id="valTargetCalc">💡 每天需喝 8 杯水满足今日目标</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="pbFill"></div>
    </div>
    <div class="progress-text" id="valProgressText">今日已喝：0 / 2000 ml (0 / 8 杯) · 0%</div>
  </div>

  <!-- 📊 日历统计与月度总览卡片 -->
  <div class="calendar-card">
    <div class="cal-header">
      <button class="cal-nav" onclick="changeMonth(-1)">◀ 上个月</button>
      <div class="cal-title" id="calMonthTitle">2026年11月</div>
      <button class="cal-nav" onclick="changeMonth(1)">下个月 ▶</button>
    </div>

    <!-- 月度指标总览 -->
    <div class="stats-overview">
      <div class="stat-item">
        <div class="stat-num" id="statMonthTotal">0 杯</div>
        <div class="stat-label">月累计饮水</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statMonthGoal" style="color: #2E7D32;">0 天</div>
        <div class="stat-label" id="statMonthGoalLabel">达标天数</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statMonthAvg" style="color: #00ACC1;">0 杯</div>
        <div class="stat-label">日均喝水</div>
      </div>
    </div>

    <!-- 星期表头 -->
    <div class="weekdays">
      <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
    </div>

    <!-- 日历格子 -->
    <div class="days-grid" id="daysGrid"></div>

    <!-- 单日详情与打卡微调 -->
    <div class="day-detail">
      <div class="detail-left">
        <div class="detail-date" id="detailDate">📅 2026-11-05 (今天)</div>
        <div class="detail-cups" id="detailCups">喝了 0 杯水 (约 0 ml)</div>
      </div>
      <div class="detail-actions">
        <button class="btn-round" onclick="adjustWater(-1)">-</button>
        <button class="btn-round btn-add" onclick="adjustWater(1)">+1</button>
      </div>
    </div>
  </div>

</div>

<script>
  // 数据持久化
  const STORAGE_KEY = 'water_pet_history';
  const CONFIG_KEY = 'water_pet_config';

  function getConfig() {
    try {
      const cfg = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}');
      return {
        dailyTargetMl: cfg.dailyTargetMl || 2000,
        cupCapacityMl: cfg.cupCapacityMl || 250
      };
    } catch {
      return { dailyTargetMl: 2000, cupCapacityMl: 250 };
    }
  }

  function saveConfig(cfg) {
    localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
  }

  function getHistory() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch { return {}; }
  }
  function saveHistory(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function getTodayStr() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  let viewYear = new Date().getFullYear();
  let viewMonth = new Date().getMonth() + 1; // 1..12
  let selectedDate = getTodayStr();

  function promptDailyTarget() {
    const cfg = getConfig();
    const res = prompt('请输入每日喝水目标总量 (ml)：', cfg.dailyTargetMl);
    const num = parseInt(res);
    if (!isNaN(num) && num >= 100) {
      cfg.dailyTargetMl = num;
      saveConfig(cfg);
      updateGoalCard();
      renderCalendar();
    }
  }

  function promptCupCapacity() {
    const cfg = getConfig();
    const res = prompt('请输入单杯水容量 (ml)：', cfg.cupCapacityMl);
    const num = parseInt(res);
    if (!isNaN(num) && num >= 50) {
      cfg.cupCapacityMl = num;
      saveConfig(cfg);
      updateGoalCard();
      renderCalendar();
    }
  }

  function updateGoalCard() {
    const cfg = getConfig();
    const targetCups = Math.max(1, Math.ceil(cfg.dailyTargetMl / cfg.cupCapacityMl));

    document.getElementById('valDailyTarget').innerText = `${cfg.dailyTargetMl} ml`;
    document.getElementById('valCupCapacity').innerText = `${cfg.cupCapacityMl} ml`;
    document.getElementById('valTargetCalc').innerText = `💡 每天需喝 ${targetCups} 杯水满足今日目标`;

    const data = getHistory();
    const todayCups = data[getTodayStr()] || 0;
    const todayMl = todayCups * cfg.cupCapacityMl;
    const percent = Math.min(100, Math.round((todayMl / cfg.dailyTargetMl) * 100));

    document.getElementById('pbFill').style.width = `${percent}%`;
    const status = todayMl >= cfg.dailyTargetMl ? ' 🎉 今日已达标！' : '';
    document.getElementById('valProgressText').innerText =
      `今日已喝：${todayMl} / ${cfg.dailyTargetMl} ml (${todayCups} / ${targetCups} 杯) · ${percent}%${status}`;
  }

  // 播放温和水滴音效
  function playWaterSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    } catch (_) {}
  }

  function onPetClick() {
    const el = document.getElementById('petWrapper');
    el.classList.add('bounce');
    playWaterSound();
    setTimeout(() => el.classList.remove('bounce'), 450);
  }

  function drinkWater() {
    adjustWaterForDate(getTodayStr(), 1);
    onPetClick();
    resetTimer();
  }

  function delayReminder() {
    countdown = 5 * 60;
    document.getElementById('bubbleBox').style.opacity = '0.5';
    setTimeout(() => document.getElementById('bubbleBox').style.opacity = '1', 500);
  }

  function adjustWater(delta) {
    adjustWaterForDate(selectedDate, delta);
  }

  function adjustWaterForDate(dateStr, delta) {
    const data = getHistory();
    const current = data[dateStr] || 0;
    const next = Math.max(0, current + delta);
    data[dateStr] = next;
    saveHistory(data);
    updateGoalCard();
    renderCalendar();
  }

  function changeMonth(delta) {
    viewMonth += delta;
    if (viewMonth < 1) { viewMonth = 12; viewYear--; }
    else if (viewMonth > 12) { viewMonth = 1; viewYear++; }
    renderCalendar();
  }

  function renderCalendar() {
    document.getElementById('calMonthTitle').innerText = `${viewYear}年${String(viewMonth).padStart(2, '0')}月`;
    const data = getHistory();
    const todayStr = getTodayStr();
    const cfg = getConfig();
    const targetCups = Math.max(1, Math.ceil(cfg.dailyTargetMl / cfg.cupCapacityMl));

    // 计算当月指标
    const firstDay = new Date(viewYear, viewMonth - 1, 1).getDay();
    const maxDays = new Date(viewYear, viewMonth, 0).getDate();

    let monthTotal = 0;
    let goalDays = 0;
    let activeDays = 0;

    for (let d = 1; d <= maxDays; d++) {
      const dStr = `${viewYear}-${String(viewMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const cups = data[dStr] || 0;
      if (cups > 0) {
        monthTotal += cups;
        activeDays++;
        if (cups >= targetCups) goalDays++;
      }
    }

    document.getElementById('statMonthTotal').innerText = `${monthTotal} 杯`;
    document.getElementById('statMonthGoal').innerText = `${goalDays} 天`;
    document.getElementById('statMonthGoalLabel').innerText = `达标天数(≥${targetCups}杯)`;
    document.getElementById('statMonthAvg').innerText = (activeDays > 0 ? (monthTotal / activeDays).toFixed(1) : '0') + ' 杯';

    // 渲染网格
    const grid = document.getElementById('daysGrid');
    grid.innerHTML = '';

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      grid.appendChild(empty);
    }

    for (let d = 1; d <= maxDays; d++) {
      const dStr = `${viewYear}-${String(viewMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const cups = data[dStr] || 0;
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (dStr === todayStr) cell.classList.add('today');
      if (dStr === selectedDate) cell.classList.add('selected');
      if (cups >= targetCups) cell.classList.add('goal');

      cell.innerHTML = `<div>${d}</div><div class="day-cups">${cups > 0 ? cups : ''}</div>`;
      cell.onclick = () => {
        selectedDate = dStr;
        renderCalendar();
      };
      grid.appendChild(cell);
    }

    // 刷新单日详情
    const isToday = (selectedDate === todayStr);
    document.getElementById('detailDate').innerText = `📅 ${selectedDate}${isToday ? ' (今天)' : ''}`;
    const selCups = data[selectedDate] || 0;
    const selMl = selCups * cfg.cupCapacityMl;
    const isGoal = (selCups >= targetCups);
    document.getElementById('detailCups').innerText =
      `共喝水 ${selCups} 杯 (约 ${selMl} ml / 目标 ${cfg.dailyTargetMl} ml)` +
      (isGoal ? ' ✨ 达成目标！' : ` (还需 ${Math.max(0, targetCups - selCups)} 杯达标)`);
  }

  // 30分钟倒计时调度
  let countdown = 30 * 60;
  function resetTimer() { countdown = 30 * 60; }
  setInterval(() => {
    if (countdown > 0) {
      countdown--;
      const m = Math.floor(countdown / 60);
      const s = countdown % 60;
      document.getElementById('timerBadge').innerText = `下次提醒：${m}分${String(s).padStart(2, '0')}秒`;
    } else {
      playWaterSound();
      onPetClick();
      resetTimer();
    }
  }, 1000);

  // 初始化
  updateGoalCard();
  renderCalendar();
</script>
</body>
</html>
