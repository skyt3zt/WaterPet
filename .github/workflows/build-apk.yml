name: Build WaterPet APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持在 GitHub 网页手动点击 Run workflow 触发打包

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Gradle Wrapper & Build APK
      run: |
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WaterPet-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    - name: Publish GitHub Release (Optional)
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        tag_name: release-${{ github.run_number }}
        name: 💧 喝水桌宠 v1.0.${{ github.run_number }} APK
        body: |
          ### 💧 喝水桌宠 (WaterPet) 安卓端安装包
          直接下载下方的 `app-debug.apk` 发送给手机安装即可！
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
